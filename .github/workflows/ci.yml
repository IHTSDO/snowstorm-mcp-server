name: CI

# Pushes to main and staging are tested by deploy.yml, which calls this
# workflow before building an image, so there is no push trigger here.
on:
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Same interpreter as the Docker image.
      UV_PYTHON: "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.1"

      # Exactly the versions in uv.lock, the same ones the Docker image
      # installs. --locked fails if uv.lock is stale against pyproject.toml.
      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Lint + typecheck + unit tests
        run: ./scripts/check.sh
