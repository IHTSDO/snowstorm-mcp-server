name: Deploy

# staging branch -> staging environment (dev host), automatically.
# main branch    -> production environment, after a reviewer approves the job.
#
# Manual runs redeploy an image that was already built, e.g. to roll back:
# run this workflow from the branch matching the environment and give the
# full commit SHA of the build to put back.
on:
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA of a previously built image to redeploy
        required: true
        type: string

# One deploy per environment at a time; a newer push waits rather than
# cancelling a deploy that is halfway through recreating the container.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/ihtsdo/snowstorm-mcp-server

jobs:
  ci:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    # Run after a successful build, or on a manual redeploy where build is skipped.
    if: ${{ !cancelled() && !failure() && (github.ref_name == 'main' || github.ref_name == 'staging') }}
    runs-on: ubuntu-latest
    # packages: read lets this job's GITHUB_TOKEN pull the private image; the
    # host borrows it for one pull (see deploy/remote-deploy.sh).
    permissions:
      contents: read
      packages: read
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - name: Resolve image
        id: image
        env:
          BUILT: ${{ needs.build.outputs.image }}
          SHA: ${{ inputs.sha }}
        run: |
          if [ -n "$BUILT" ]; then
            echo "ref=$BUILT" >> "$GITHUB_OUTPUT"
          elif [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ref=$IMAGE:sha-$SHA" >> "$GITHUB_OUTPUT"
          else
            echo "::error::sha must be a full 40-character commit SHA"
            exit 1
          fi

      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key is pinned to a forced command on the host, so the image
          # reference is the only command this connection can pass. The
          # registry token goes on stdin, never on the command line; it
          # expires when this job ends.
          printf '%s\n%s\n' "$REGISTRY_TOKEN" "$GITHUB_ACTOR" |
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              -o BatchMode=yes "$TARGET" "$IMAGE_REF"

      - name: Summary
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: echo "Deployed \`$IMAGE_REF\`" >> "$GITHUB_STEP_SUMMARY"
