name: Promotion guard

# main only takes changes that have already been through staging, plus
# emergency hotfix/* branches (merge main back into staging afterwards).
on:
  pull_request:
    branches: [main]

jobs:
  source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::PRs into main must come from this repo's staging or hotfix/* branch. Target staging instead."
            exit 1
          fi
          case "$HEAD_REF" in
            staging|hotfix/*) echo "OK: $HEAD_REF -> main" ;;
            *) echo "::error::PRs into main must come from staging or hotfix/*. Retarget this PR to staging."; exit 1 ;;
          esac
