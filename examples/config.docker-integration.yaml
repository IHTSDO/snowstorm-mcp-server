# MCP config for the local Docker integration stack started via
# `docker-compose.integration.yml`.
#
# Ports:
# - Snowstorm (full): http://localhost:8080
# - Snowstorm Lite:   http://localhost:8082
#
# Recommended usage for tests:
#   SNOWSTORM_MCP_TEST_CONFIG=examples/config.docker-integration.yaml \
#   ./.venv/bin/pytest -q tests/integration

default_terminology: snomedct

targets:
  snowstorm:
    base_url: "http://localhost:8080"
    mode: "auto"
    fhir_path: "/fhir"
    timeout_seconds: 20
    auth:
      mode: "none"

  lite:
    base_url: "http://localhost:8082"
    mode: "lite"
    terminology_name: "snomedct-lite"
    fhir_path: "/fhir"
    timeout_seconds: 20
    auth:
      mode: "none"
