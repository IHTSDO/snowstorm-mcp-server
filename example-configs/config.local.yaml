# Server mode restricts which tools are exposed:
#   "snowstorm" — all tools (FHIR + Snowstorm-native)
#   "lite"      — FHIR-only tools (no Snowstorm-native tools)
server_mode: "snowstorm"

# Default terminology used when 'terminology' parameter is omitted.
# For Snowstorm targets, terminologies are auto-discovered from /codesystems
# (lowercased shortName, e.g. "snomedct", "snomedct-us").
default_terminology: snomedct

targets:
  # Snowstorm (full) -- terminologies auto-discovered from /codesystems.
  snowstorm:
    base_url: "http://localhost:8080"
    mode: "auto"
    fhir_path: "/fhir"
    timeout_seconds: 10
    auth:
      mode: "none"
