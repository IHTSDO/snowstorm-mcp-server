# Configuration for local Snowstorm Lite instances.
#
# server_mode "lite" exposes only FHIR-based tools — the Snowstorm-native
# tools (snowstorm_list_codesystems, snowstorm_search_concepts, etc.) are
# not registered, keeping the tool surface clean for LLM clients.
#
# Snowstorm Lite serves a single SNOMED CT edition per instance, so add
# one target per edition you want to query.

server_mode: "lite"

default_terminology: snomedct

# Performance guards — all values shown are defaults; omit the block to use defaults.
# For public-facing deployments, set per_session_rate_limit_calls to prevent one
# session from exhausting the global budget. See README for guidance.
# guards:
#   rate_limit_calls: 10
#   rate_limit_window_seconds: 60
#   max_concurrent_requests: 3
#   max_count_per_call: 500
#   large_result_threshold: 1000
#   max_children_calls_per_minute: 5
#   per_session_rate_limit_calls: null  # set an integer to enable per-session limiting
#   block_zero_cardinality_on_large_sets: true  # blocks [0..0] cardinality on top-level roots
#   enable_expansion_size_guard: false  # preflight summary check for any non-summary expansion
#   expansion_count_threshold: 20000    # block if total concepts exceeds this value
#   size_cache_ttl_seconds: 86400       # how long to cache expansion counts (default: 24 h)

targets:
  # International edition
  lite-int:
    base_url: "http://localhost:8082"
    mode: "lite"
    terminology_name: "snomedct"
    fhir_path: "/fhir"
    timeout_seconds: 10
    auth:
      mode: "none"

  # Uncomment to add a second edition (e.g. NZ) on another Lite instance:
  # lite-nz:
  #   base_url: "http://localhost:8083"
  #   mode: "lite"
  #   terminology_name: "snomedct-nz"
  #   fhir_path: "/fhir"
  #   timeout_seconds: 10
  #   auth:
  #     mode: "none"
