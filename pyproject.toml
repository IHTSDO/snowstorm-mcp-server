[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "snowstorm-mcp-server"
version = "1.0.0"
description = "MCP adapter service for Snowstorm and Snowstorm Lite"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "SNOMED International" }]
dependencies = [
  "httpx>=0.27.0",
  "mcp>=1.26.0",
  "pydantic>=2.8.0",
  "python-dotenv>=1.0.0",
  "PyYAML>=6.0.1",
]

[project.optional-dependencies]
dev = [
  "anyio>=4.4.0",
  "mypy>=1.11.2",
  "pre-commit>=3.8.0",
  "pytest>=8.3.0",
  "ruff>=0.6.9",
]

[tool.hatch.build]
ignore-vcs = true
exclude = [
  "/uv.lock",
]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/snowstorm_mcp_server"]

[project.scripts]
snowstorm-mcp-server = "snowstorm_mcp_server.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: tests that require live Snowstorm/Snowstorm Lite endpoints",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true
